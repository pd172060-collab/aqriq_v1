<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriQ | Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="dashboard.html" aria-label="AgriQ dashboard">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>AgriQ</span>
    </a>
    <button id="logout" class="logout-button" type="button">Logout</button>
  </header>

  <main class="dashboard">
    <section class="welcome" aria-labelledby="welcome-heading">
      <p class="eyebrow">Farmer services portal</p>
      <h1 id="welcome-heading">Welcome, <span id="welcomeName">Farmer</span></h1>
      <p>Access AgriQ services and keep your details handy.</p>
    </section>

    <section class="dashboard-grid" aria-label="Farmer dashboard">
      <article class="dashboard-card profile-card">
        <div class="card-icon" aria-hidden="true">&#128100;</div>
        <div>
          <p class="card-label">Farmer profile</p>
          <h2 id="name"></h2>
          <p class="mobile-number"><span aria-hidden="true">&#9742;</span> <span id="mobileNumber"></span></p>
        </div>
      </article>

      <article class="dashboard-card queue-card" aria-labelledby="queue-heading">
        <div>
          <p class="card-label">My Queue</p>
          <h2 id="queue-heading">Current token</h2>
          <p id="queueToken" class="queue-token">No active token</p>
          <p id="queueDetails" class="queue-details">Book a slot to receive your queue token.</p>
        </div>
        <span id="queueStatus" class="queue-status" hidden></span>
      </article>

      <article class="dashboard-card service-card">
        <p class="card-label">Services</p>
        <h2>Manage your farm visits</h2>
        <div class="action-buttons">
          <button id="bookSlot" class="primary-button" type="button">Book Slot</button>
          <button id="myBookings" class="secondary-button" type="button">My Bookings</button>
          <button id="procurement" class="secondary-button" type="button">Procurement</button>
          <button id="paymentStatus" class="secondary-button" type="button">Payment Status</button>
          <button id="adminDashboard" class="secondary-button" type="button">Admin Dashboard</button>
          <button id="myProfile" class="secondary-button" type="button">My Profile</button>
        </div>
        <p id="actionMessage" class="action-message" role="status" aria-live="polite"></p>
      </article>
    </section>
  </main>
  <script>
    let farmer;
    try {
      farmer = JSON.parse(sessionStorage.getItem('farmer'));
    } catch (error) {
      farmer = null;
    }

    if (!farmer || !farmer.name || !farmer.mobileNumber) {
      window.location.replace('index.html');
    } else {
      document.getElementById('welcomeName').textContent = farmer.name;
      document.getElementById('name').textContent = farmer.name;
      document.getElementById('mobileNumber').textContent = farmer.mobileNumber;
    }

    document.getElementById('bookSlot').addEventListener('click', () => {
      window.location.href = 'booking.html';
    });
    document.getElementById('myBookings').addEventListener('click', () => {
      window.location.href = 'booking.html#my-bookings';
    });
    document.getElementById('procurement').addEventListener('click', () => {
      window.location.href = 'procurement.html';
    });
    document.getElementById('paymentStatus').addEventListener('click', () => {
      window.location.href = 'payment.html';
    });
    document.getElementById('adminDashboard').addEventListener('click', () => {
      window.location.href = 'admin.html';
    });

    async function loadCurrentQueue() {
      if (!farmer || !farmer.id) return;
      try {
        const response = await fetch(`/api/bookings/farmer/${farmer.id}`);
        if (!response.ok) throw new Error();
        const bookings = await response.json();
        const currentBooking = bookings.find((booking) => booking.queueStatus && booking.queueStatus !== 'COMPLETED');
        if (!currentBooking) return;
        document.getElementById('queueToken').textContent = `Token #${currentBooking.tokenNumber}`;
        document.getElementById('queueDetails').textContent = `${currentBooking.bookingDate} · ${currentBooking.timeSlot}`;
        const queueStatus = document.getElementById('queueStatus');
        queueStatus.textContent = currentBooking.queueStatus;
        queueStatus.className = `queue-status status-${currentBooking.queueStatus.toLowerCase()}`;
        queueStatus.hidden = false;
      } catch (error) {
        document.getElementById('queueDetails').textContent = 'Queue status is currently unavailable.';
      }
    }

    loadCurrentQueue();
    const actionMessage = document.getElementById('actionMessage');
    document.getElementById('myProfile').addEventListener('click', () => {
      actionMessage.textContent = 'Your profile details are shown above.';
    });
    document.getElementById('logout').addEventListener('click', () => { sessionStorage.clear(); window.location.href = 'index.html'; });
  </script>
</body>
</html>
