<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriQ | Procurement</title>
  <link rel="stylesheet" href="css/payment.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="dashboard.html" aria-label="AgriQ dashboard"><span class="brand-mark" aria-hidden="true">A</span><span>AgriQ</span></a>
    <a class="dashboard-link" href="dashboard.html">Back to Dashboard</a>
  </header>

  <main class="payment-page">
    <section class="page-heading">
      <p class="eyebrow">Farmer services portal</p>
      <h1>Digital procurement recording</h1>
      <p>Record crop procurement and view your previous records.</p>
    </section>

    <section class="payment-layout">
      <section class="card form-card" aria-labelledby="form-heading">
        <h2 id="form-heading">Procurement details</h2>
        <form id="procurementForm">
          <label for="cropName">Crop Name</label>
          <input id="cropName" type="text" placeholder="e.g. Wheat" required>
          <div class="form-row">
            <div><label for="quantityKg">Quantity (kg)</label><input id="quantityKg" type="number" min="0.01" step="0.01" required></div>
            <div><label for="grade">Grade</label><select id="grade" required><option value="">Select grade</option><option>Grade A</option><option>Grade B</option><option>Grade C</option></select></div>
          </div>
          <label for="mspPerKg">MSP per kg (₹)</label>
          <input id="mspPerKg" type="number" min="0.01" step="0.01" required>
          <div class="location-card" aria-live="polite"><span class="location-label">Calculated total amount</span><strong id="totalAmount">₹0.00</strong></div>
          <label for="procurementDate">Procurement Date</label>
          <input id="procurementDate" type="date" required>
          <button class="primary-button" type="submit">Record Procurement</button>
        </form>
        <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
      </section>

      <section class="card records-card" aria-labelledby="records-heading">
        <div class="section-title"><div><p class="eyebrow">Your records</p><h2 id="records-heading">Previous Procurements</h2></div><button id="refreshRecords" class="text-button" type="button">Refresh</button></div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Crop</th><th>Quantity</th><th>Grade</th><th>MSP/kg</th><th>Total</th><th>Date</th></tr></thead>
            <tbody id="procurementRows"><tr><td colspan="6" class="empty-state">Loading procurement records...</td></tr></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script>
    let farmer;
    try { farmer = JSON.parse(sessionStorage.getItem('farmer')); } catch (error) { farmer = null; }
    const farmerId = farmer && farmer.id;
    if (!farmerId) window.location.replace('index.html');

    const form = document.getElementById('procurementForm');
    const quantityInput = document.getElementById('quantityKg');
    const mspInput = document.getElementById('mspPerKg');
    const totalAmount = document.getElementById('totalAmount');
    const formMessage = document.getElementById('formMessage');
    const rows = document.getElementById('procurementRows');
    document.getElementById('procurementDate').value = new Date().toISOString().split('T')[0];

    function updateTotal() {
      const quantity = Number(quantityInput.value) || 0;
      const msp = Number(mspInput.value) || 0;
      totalAmount.textContent = `₹${(quantity * msp).toFixed(2)}`;
    }

    function formatDate(date) {
      return new Date(`${date}T00:00:00`).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function addCell(row, value) {
      const cell = document.createElement('td');
      cell.textContent = value;
      row.appendChild(cell);
    }

    function procurementRow(procurement) {
      const row = document.createElement('tr');
      addCell(row, procurement.cropName);
      addCell(row, `${Number(procurement.quantityKg).toFixed(2)} kg`);
      addCell(row, procurement.grade);
      addCell(row, `₹${Number(procurement.mspPerKg).toFixed(2)}`);
      addCell(row, `₹${Number(procurement.totalAmount).toFixed(2)}`);
      addCell(row, formatDate(procurement.procurementDate));
      return row;
    }

    async function loadProcurements() {
      if (!farmerId) return;
      rows.innerHTML = '<tr><td colspan="6" class="empty-state">Loading procurement records...</td></tr>';
      try {
        const response = await fetch(`/api/procurements/farmer/${farmerId}`);
        if (!response.ok) throw new Error();
        const procurements = await response.json();
        rows.innerHTML = '';
        if (!procurements.length) {
          rows.innerHTML = '<tr><td colspan="6" class="empty-state">No procurement records have been added.</td></tr>';
          return;
        }
        procurements.forEach((procurement) => rows.appendChild(procurementRow(procurement)));
      } catch (error) {
        rows.innerHTML = '<tr><td colspan="6" class="empty-state error-state">Unable to load procurement records.</td></tr>';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      formMessage.textContent = '';
      const procurement = {
        farmerId,
        cropName: document.getElementById('cropName').value.trim(),
        quantityKg: Number(quantityInput.value),
        grade: document.getElementById('grade').value,
        mspPerKg: Number(mspInput.value),
        procurementDate: document.getElementById('procurementDate').value
      };
      try {
        const response = await fetch('/api/procurements', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(procurement) });
        if (!response.ok) throw new Error();
        formMessage.textContent = 'Procurement recorded successfully.';
        form.reset();
        document.getElementById('procurementDate').value = new Date().toISOString().split('T')[0];
        updateTotal();
        await loadProcurements();
      } catch (error) {
        formMessage.textContent = 'Unable to record procurement. Please try again.';
      }
    });

    quantityInput.addEventListener('input', updateTotal);
    mspInput.addEventListener('input', updateTotal);
    document.getElementById('refreshRecords').addEventListener('click', loadProcurements);
    updateTotal();
    loadProcurements();
  </script>
</body>
</html>
